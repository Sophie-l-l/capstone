steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/backend/Dockerfile.production'
      - '-t'
      - 'gcr.io/$PROJECT_ID/educode-backend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/educode-backend:$BUILD_ID'
      - '.'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'educode-backend'
      - '--image=gcr.io/$PROJECT_ID/educode-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=DATABASE_URL=postgresql://postgres:EduCode2025SecureDB!@34.28.152.182:5432/educode,JWT_SECRET=educode_super_secret_jwt_key_2025,NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/educode-backend:latest'
  - 'gcr.io/$PROJECT_ID/educode-backend:$BUILD_ID'

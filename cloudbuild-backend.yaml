steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/backend/Dockerfile.production'
      - '-t'
      - 'gcr.io/$PROJECT_ID/educode-backend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/educode-backend:$BUILD_ID'
      - '.'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'educode-backend'
      - '--image=gcr.io/$PROJECT_ID/educode-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
      - '--update-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/educode-backend:latest'
  - 'gcr.io/$PROJECT_ID/educode-backend:$BUILD_ID'

services:
  postgres:
    image: postgres:16-alpine
    container_name: educode-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: educode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educode"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: educode-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # Optional: comment out if not used yet
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: educode-backend
    working_dir: /app/apps/backend
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/educode?schema=public
      AI_SERVICE_URL: http://ai-service:8000
    env_file:
      - .env
      # Add Judge0 or other service URLs here if needed
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - backend-node-modules:/app/apps/backend/node_modules
    ports:
      - "3001:3001"
    command: >-
      sh -c "npm run prisma:generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: educode-frontend
    working_dir: /app/apps/frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    env_file:
      - .env
    volumes:
      - ./:/app
      - frontend-node-modules:/app/apps/frontend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["npm", "run", "dev"]

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile.dev
    container_name: educode-ai-service
    working_dir: /app/apps/ai-service
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      LLM_MIN_CONFIDENCE: "0.75"
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: ["/opt/venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  backend-node-modules:
  frontend-node-modules:
  
